<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ポケカ対戦</title>
<style>
:root{color-scheme:light dark;--bd:#8886;--ac:#2f6f5e}
*{box-sizing:border-box}
body{font:14px/1.5 system-ui,"Noto Sans JP",sans-serif;margin:0 auto;padding:12px;max-width:1000px}
h1{font-size:18px;margin:0 0 8px}
h2{font-size:13px;margin:10px 0 2px;opacity:.7}
button,select{font:inherit;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:transparent;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac)}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;margin:6px 0}
.sub{opacity:.75;font-size:13px}
#bar{padding:6px 0;border-bottom:1px solid var(--bd)}
.field{display:grid;grid-template-columns:84px 1fr 84px;gap:8px;align-items:start;margin:6px 0}
.pile{border:2px dashed #888;border-radius:8px;padding:6px;text-align:center;font-size:12px;background:#eee;color:#222}
.pile.prize{background:#bff;border:2px solid #4cc}
.pile.deck{border-color:#e33;background:#fdd}
.pile button{margin-top:4px;font-size:11px;padding:2px 6px;color:#222}
.zone{display:flex;flex-direction:column;gap:8px}
.bench{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;border:3px dashed #5a3;border-radius:8px;padding:5px;background:#cf9}
.act{display:flex;gap:8px;align-items:flex-start;border:3px dashed #eb0;border-radius:8px;padding:5px;background:#fe9;min-height:150px;color:#222}
.mon{position:relative;aspect-ratio:63/88;background:#fff8;border:1px solid #8886;border-radius:6px;overflow:hidden;color:#222;font-size:11px;cursor:pointer}
.act .mon{width:105px;flex:none}
.mon img{width:100%;height:100%;object-fit:cover;display:block}
.mon.empty{display:flex;align-items:center;justify-content:center;opacity:.5;cursor:default}
.ov{position:absolute;left:0;right:0;bottom:0;background:#000b;color:#fff;padding:1px 3px}
.ov u{text-decoration:none;background:#c33;border-radius:3px;margin-left:2px;padding:0 2px}
.e{display:inline-block;font-style:normal;border:1px solid #fff8;border-radius:50%;width:16px;height:16px;text-align:center;line-height:14px;margin:1px;font-size:10px}
.row.hand{border:3px dashed #58e;border-radius:8px;background:#bcd7ff;padding:6px;overflow-x:auto;flex-wrap:nowrap;color:#222}
.hand .c{flex:none;width:84px;font-size:11px;text-align:center;cursor:pointer}
.hand img{width:84px;border-radius:4px;display:block}
#log{font-size:12px;max-height:180px;overflow:auto;border-top:1px solid var(--bd);margin-top:10px;padding-top:6px}
#modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:9}
#modal[hidden]{display:none}
.box{background:Canvas;color:CanvasText;padding:16px;border-radius:10px;max-width:92vw;max-height:88vh;overflow:auto}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.grid .on{background:var(--ac);color:#fff}
.dt{display:flex;gap:16px;flex-wrap:wrap}
.big{width:250px;border-radius:10px;display:block}
.side{flex:1;min-width:240px;max-width:420px}
.side p{margin:6px 0;font-size:13px}
.opt{display:flex;gap:8px;align-items:center;margin:6px 0}
</style>
</head>
<body>
<div id="setup">
  <h1>ポケカ対戦</h1>
  <p class="sub">変換ツールで作った cards.json と decks.json を選んでください（複数選択可）。読み込んだデータはこのブラウザに保存されます。</p>
  <input type="file" id="files" accept=".json" multiple>
  <p id="info" class="sub"></p>
  <label>プロキシURL（画像の読み込み用） <input id="proxy" placeholder="https://xxxx.workers.dev/?url=" style="width:100%;padding:6px"></label>
  <div class="row">
    <label>あなたのデッキ <select id="myDeck"></select></label>
    <label>AIのデッキ <select id="aiDeck"></select></label>
  </div>
  <button id="start" class="pri">対戦開始</button>
  <p id="msg" style="color:#c0392b"></p>
</div>
<div id="game" hidden>
  <div id="bar"></div>
  <h2>相手</h2><div id="opp"></div>
  <h2>あなた</h2><div id="mine"></div>
  <h2>手札</h2><div id="hand" class="row hand"></div>
  <div id="log"></div>
</div>
<div id="modal" hidden></div>

<script>

const $ = id => document.getElementById(id);
const N = t => t === "lightning" ? "electric" : t;
const TL = { grass: "草", fire: "炎", water: "水", electric: "雷", psychic: "超", fighting: "闘", dark: "悪", steel: "鋼", dragon: "竜", fairy: "妖", colorless: "無" };
const SCL = { poison: "毒", burn: "火", sleep: "眠", para: "痺", conf: "混" };
const SCN = { どく: "poison", やけど: "burn", ねむり: "sleep", マヒ: "para", こんらん: "conf" };
let CARDS = new Map(), DECKS = [], S = null, uid = 0, busy = false;
const sh = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = t => String(t).replace(/\{(\w+)\}/g, (_, k) => `【${TL[N(k)] || k}】`);
const log = m => S.log.unshift(m);
const msg = m => $("msg").textContent = m;
const flip = () => Math.random() < .5;

// データ読み込み
function ingest(list) {
  for (const x of list) {
    if (x.entries) DECKS = DECKS.filter(d => d.code !== x.code).concat(x);
    else CARDS.set(x.id, x);
  }
}
function save() { try { localStorage.setItem("pk", JSON.stringify({ c: [...CARDS.values()], d: DECKS })); } catch {} }
function fill() {
  const o = DECKS.map(d => `<option value="${d.code}">${d.code}（${d.total}枚）</option>`).join("");
  $("myDeck").innerHTML = o; $("aiDeck").innerHTML = o;
  $("info").textContent = `カード ${CARDS.size}種 / デッキ ${DECKS.length}件`;
}
try { const o = JSON.parse(localStorage.getItem("pk") || "null"); if (o) { ingest(o.c); ingest(o.d); } } catch {}
fill();
$("files").onchange = async e => {
  for (const f of e.target.files) { try { ingest(JSON.parse(await f.text())); } catch { msg(f.name + " を読めません"); } }
  save(); fill();
};

// 基本ルール
const isB = c => c.kind === "pokemon" && c.stage === "basic";
const mons = P => [P.act, ...P.bench].filter(Boolean);
const idx = P => S.p.indexOf(P);
const cur = () => S.p[S.cur], opp = () => S.p[1 - S.cur];
const full = P => P.bench.length >= 5;
const hpLeft = m => hpMax(m) - m.d;
const draw = (P, n = 1) => { let k = 0; while (n-- > 0 && P.deck.length) { P.hand.push(P.deck.shift()); k++; } return k; };
const mkP = (deck, ai) => ({ ai, deck: sh(deck), hand: [], prize: [], act: null, bench: [], dis: [], turns: 0, en: 0, sup: 0, ret: 0, ab: {}, kod: -9, bonus: [], res: [] });
const mk = (P, h) => ({ c: h.c, u: h, d: 0, en: [], pt: P.turns, ev: 0, under: [], lock: 0, nr: 0, sc: {}, tool: null });
const rm = (P, h) => P.hand.splice(P.hand.indexOf(h), 1);
const benchIt = (P, h) => { rm(P, h); P.bench.push(mk(P, h)); };
const attach = (P, m, h) => { rm(P, h); m.en.push(h); P.en = 1; };
const trash = (P, m) => P.dis.push(m.u, ...m.under, ...m.en, ...(m.tool ? [m.tool] : []));

function canEvo(P, m, h) {
  const c = h.c;
  return c.kind === "pokemon" && c.stage !== "basic" && (c.evolvesFrom || []).includes(m.c.name)
    && m.pt < P.turns && m.ev !== P.turns && !(S.first === idx(P) && P.turns === 1);
}
function evolve(P, m, h) { rm(P, h); m.under.push(m.u); m.u = h; m.c = h.c; m.ev = P.turns; m.sc = {}; log(`${m.c.name}に進化`); }
function swap(P, m) {
  const i = P.bench.indexOf(m);
  if (i < 0) return;
  const a = P.act; a.sc = {}; P.bench.splice(i, 1, a); P.act = m;
}

function canAtk(P, i) {
  const a = P.act, at = a && a.c.attacks[i];
  if (!at || a.lock === P.turns || (a.lockN && a.lockN[at.name] === P.turns) || a.sc.sleep || a.sc.para) return false;
  if (S.first === idx(P) && P.turns === 1) return false;
  return pay(a, effCost(P, a, at));
}
const canRet = P => P.act && !P.ret && P.bench.length && P.act.en.length >= retCost(P, P.act) && !P.act.sc.sleep && !P.act.sc.para && P.act.nr !== P.turns;

// 選択モーダル
function choose(t, items, n = 1, exact = true) {
  if (!items.length) return Promise.resolve([]);
  const need = exact ? Math.min(n, items.length) : 0;
  return new Promise(res => {
    const sel = [], M = $("modal");
    M.hidden = false; M.onclick = null;
    const paint = () => {
      M.innerHTML = `<div class="box"><h3>${t}${n > 1 ? `（${sel.length}/${n}）` : ""}</h3><div class="grid">${items.map((x, i) =>
        `<button data-i="${i}" class="${sel.includes(x) ? "on" : ""}">${x.c.name}${x.d !== undefined ? ` ${hpLeft(x)}/${hpMax(x)}` : ""}</button>`).join("")}</div>${n > 1 || !exact ? `<button id="ok" ${sel.length >= need && sel.length <= n ? "" : "disabled"}>決定</button>` : ""}</div>`;
      M.querySelectorAll(".grid button").forEach(b => b.onclick = () => {
        const x = items[b.dataset.i], k = sel.indexOf(x);
        if (k >= 0) sel.splice(k, 1); else if (sel.length < n) sel.push(x);
        if (n === 1 && exact) { M.hidden = true; res([x]); } else paint();
      });
      const ok = M.querySelector("#ok");
      if (ok) ok.onclick = () => { M.hidden = true; res(sel.slice()); };
    };
    paint();
  });
}
const sel = (P, l, n, t, exact) => P.ai ? l.slice(0, n) : choose(t, l, n, exact);
const ask = async (P, t) => P.ai || (await choose(t, [{ c: { name: "はい" } }, { c: { name: "いいえ" } }]))[0].c.name === "はい";
const pickMon = async (P, list, t, enemy) => !list.length ? null : P.ai ? (enemy ? list.slice().sort((a, b) => hpLeft(a) - hpLeft(b))[0] : list[0]) : (await choose(t, list))[0];

// ===== 分析ロジック =====
const ST = { どく: "poison", やけど: "burn", ねむり: "sleep", マヒ: "paralysis", こんらん: "confusion" };
const ZN = { 手札: "hand", 山札: "deck", トラッシュ: "discard" };
const WHOS = { 自分: "own", 相手: "opp", おたがい: "both" };
const KJ = { 炎: "fire", 水: "water", 草: "grass", 雷: "electric", 超: "psychic", 闘: "fighting", 悪: "dark", 鋼: "steel" };
const clean = t => (t || "").replace(/（[^）]*）/g, "").replace(/［[^］]*］/g, "").replace(/\s+/g, " ").trim();
const sents = t => clean(t).split("。").map(x => x.trim()).filter(Boolean);

// 絞り込み
function flt(s) {
  if (s.includes("または")) return { any: s.split("または").map(flt) };
  s = s.replace(/^「(.+)」$/, "$1");
  const f = {};
  let m;
  if ((m = s.match(/^基本\{(\w+)\}エネルギー$/))) return { kind: "energy", basic: true, type: m[1] };
  if ((m = s.match(/^(?:\{(\w+)\}タイプの|\{(\w+)\})(.+)$/))) return Object.assign(flt(m[3]), { type: m[1] || m[2] });
  if ((m = s.match(/^HPが「?(\d+)」?以下の(.+)$/))) return Object.assign(flt(m[2]), { hpMax: +m[1] });
  if ((m = s.match(/^名前に「(.+?)」とつく(.+)$/))) return Object.assign(flt(m[2]), { nameIncludes: m[1] });
  if ((m = s.match(/^にげるためのエネルギーが(\d+)個の(.+)$/))) { f.retreat = +m[1]; s = m[2]; }
  const T = {
    ポケモン: { kind: "pokemon" }, たねポケモン: { kind: "pokemon", stage: "basic" }, 進化ポケモン: { kind: "pokemon", stage: "evolution" },
    ポケモンex: { kind: "pokemon", suffix: "ex" }, 基本エネルギー: { kind: "energy", basic: true }, エネルギー: { kind: "energy" },
    サポート: { subtype: "サポート" }, ポケモンのどうぐ: { subtype: "ポケモンのどうぐ" }, "1進化ポケモン": { kind: "pokemon", stage: "stage1" }, "2進化ポケモン": { kind: "pokemon", stage: "stage2" }, トレーナーズ: { kind: "trainer" }, グッズ: { subtype: "グッズ" }, スタジアム: { subtype: "スタジアム" }, 好きなカード: {}, カード: {}
  };
  return Object.assign(f, T[s] || { name: s });
}
function fdesc(f) {
  if (f.any) return f.any.map(fdesc).join("／");
  const a = [];
  if (f.type) a.push(f.type); if (f.hpMax) a.push(`HP${f.hpMax}以下`); if (f.nameIncludes) a.push(`名前に「${f.nameIncludes}」`);
  if (f.retreat != null) a.push(`にげる${f.retreat}`);
  if (f.name) a.push(`「${f.name}」`);
  if (f.stage === "basic") a.push("たね"); else if (f.stage) a.push("進化");
  if (f.basic) a.push("基本"); if (f.suffix) a.push("ex");
  if (f.kind) a.push(f.kind === "pokemon" ? "ポケモン" : "エネルギー"); if (f.subtype) a.push(f.subtype);
  return a.join("") || "カード";
}

// 数える対象
function cs(s) {
  let m;
  if (/^相手のバトルポケモンが受けている特殊状態$/.test(s)) return { t: "opp_active_status" };
  if ((m = s.match(/^自分のベンチの「(.+?)」$/))) return { t: "own_bench", filter: flt(m[1]) };
  if ((m = s.match(/^(おたがい|相手|自分)の?バトルポケモンについているエネルギー$/))) return { t: "active_energy", who: WHOS[m[1]] };
  if (/^このポケモンについているエネルギー$/.test(s)) return { t: "self_energy" };
  if ((m = s.match(/^(おたがい|相手|自分)の?ベンチポケモン$/))) return { t: "bench_count", who: WHOS[m[1]] };
  if (/^このポケモンにのっているダメカン$/.test(s)) return { t: "self_counters" };
  if (/^相手がすでにとったサイド(?:の枚数)?$/.test(s)) return { t: "opp_prizes_taken" };
  if ((m = s.match(/^相手の場の「(.+?)」$/))) return { t: "opp_field", filter: flt(m[1]) };
  if ((m = s.match(/^自分のポケモン全員についている(.+?)エネルギー$/))) return { t: "own_all_energy", types: [...m[1].matchAll(/\{(\w+)\}/g)].map(x => x[1]) };
  if ((m = s.match(/^自分のベンチの「(.+?)」全員にのっているダメカン$/))) return { t: "bench_counters", filter: flt(m[1]) };
  return { raw: s };
}

// 条件
function cd(s) {
  let m;
  if (/^場に(?:自分の)?スタジアムが出ている$/.test(s)) return { t: "stadium_in_play" };
  if ((m = s.match(/^自分の手札が(\d+)枚$/))) return { t: "hand_count", op: "==", n: +m[1] };
  if ((m = s.match(/^このポケモンにエネルギーが(\d+)個以上ついている$/))) return { t: "self_energy", op: ">=", n: +m[1] };
  if (/^相手のバトルポケモンにダメカンがのっている$/.test(s)) return { t: "opp_active_damaged" };
  if ((m = s.match(/^自分の場に((?:「.+?」)+)がいる$/))) return { t: "in_play_names", names: [...m[1].matchAll(/「(.+?)」/g)].map(x => x[1]) };
  if (/^このカードが手札にある$/.test(s)) return { t: "in_hand" };
  if (/^このポケモンがバトル場にいる$/.test(s)) return { t: "is_active" };
  if ((m = s.match(/^相手のバトルポケモンが「(.+?)」$/))) return { t: "opp_active_is", filter: flt(m[1]) };
  if (/^トラッシュできない$/.test(s)) return { t: "prev_failed" };
  if (/^前の相手の番に、自分のポケモンがきぜつしていた$/.test(s)) return { t: "ko_last_turn" };
  if ((m = s.match(/^(自分|相手)のサイドの残り枚数が(\d+)枚$/))) return { t: "prize_count", who: WHOS[m[1]], op: "==", n: +m[2] };
  if ((m = s.match(/^このポケモンに(?:\{(\w+)\}|([炎水草雷超闘悪鋼]))エネルギーがついている$/))) return { t: "self_has_energy", type: m[1] || KJ[m[2]] };
  if ((m = s.match(/^自分の場に(?:\{(\w+)\}タイプの)?「(.+?)」がいる$/))) return { t: "in_play_names", names: [m[2]], type: m[1] };
  if ((m = s.match(/^自分のベンチに「(.+?)」がいない$/))) return { t: "bench_lacks", name: m[1] };
  if ((m = s.match(/^自分のトラッシュに、特性「(.+?)」を持つポケモンが(\d+)枚以上ある$/))) return { t: "discard_count_ability", ability: m[1], op: ">=", n: +m[2] };
  if ((m = s.match(/^(?:この番、)?自分の(.+?)が使うワザのダメージで、相手のバトルポケモンがきぜつした$/))) return { t: "ko_by_attack", scope: m[1] };
  if (/^このワザのダメージで、相手のポケモンがきぜつした$/.test(s)) return { t: "ko_by_this_attack" };
  if ((m = s.match(/^このポケモンに「(.+?)」がついている$/))) return { t: "self_has_card", name: m[1] };
  if ((m = s.match(/^相手のトラッシュに、名前に「(.+?)」とつくカードがある$/))) return { t: "opp_discard_has", nameIncludes: m[1] };
  if ((m = s.match(/^(オモテ|ウラ)$/))) return { t: "prev_coin", face: m[1] === "オモテ" ? "heads" : "tails" };
  if ((m = s.match(/^場に「(.+?)」が出ている$/))) return { t: "stadium_named", name: m[1] };
  return { t: "raw", text: s };
}

// 効果ルール 正規表現 → 効果 第3要素は常時効果
const EN = "(基本)?(?:\\{(\\w+)\\}|([炎水草雷超闘悪鋼]))?エネルギー";
const etype = m => m[2] || KJ[m[3]] || null;
const RULES = [
  [/^自分の番に1回使える$/, () => ({ usage: "once_per_turn" })],
  [/^このポケモンがバトル場にいるなら、自分の番に1回使える$/, () => [{ usage: "once_per_turn" }, { op: "require", cond: { t: "is_active" } }]],
  [/^自分の番に1回使えて、使ったなら、このカードをトラッシュする$/, () => [{ usage: "once_per_turn" }, { op: "trash_self_after_use" }]],
  [/^自分の山札を(\d+)枚引く$/, m => ({ op: "draw", n: +m[1] })],
  [/^自分の山札から(.+?)を(\d+)枚まで、または(.+?)を(\d+)枚選び、(?:相手に見せて、)?手札に加える$/, m => ({ op: "search_choice", options: [{ filter: flt(m[1]), n: +m[2], upTo: true }, { filter: flt(m[3]), n: +m[4] }] })],
  [/^自分の(山札|トラッシュ)から、?(.+?)を(?:合計)?(\d+)枚(まで|ずつ)?選び、(?:相手に見せて、)?(手札に加える|ベンチに出す|山札にもどして切る)$/,
    m => ({ op: "search", from: ZN[m[1]], filters: (m[4] === "ずつ" || /合計/.test(m[0]) ? m[2].split(/と|(?<=」)(?=「)/) : [m[2]]).map(flt), n: +m[3], upTo: m[4] === "まで", each: m[4] === "ずつ", to: m[5][0] === "手" ? "hand" : m[5][0] === "ベ" ? "bench" : "deck", reveal: /見せて/.test(m[0]) })],
  [/^自分の山札から、?(.+?)を好きなだけ選び、ベンチに出す$/, m => ({ op: "search", from: "deck", filters: [flt(m[1])], n: "any", to: "bench" })],
  [/^自分の山札を上から(\d+)枚見て、その中から(.+?)を(?:合計)?(\d+)枚(まで)?選び、(?:相手に見せて、)?手札に加える$/, m => ({ op: "look_search", look: +m[1], filter: flt(m[2]), n: +m[3], upTo: !!m[4], to: "hand" })],
  [/^自分の山札を上から(\d+)枚見て、その中から(.+?)を好きなだけ選び、自分のポケモンに好きなようにつける$/, m => ({ op: "look_search", look: +m[1], filter: flt(m[2]), n: "any", to: "attach" })],
  [/^自分の山札を上から(\d+)枚見て、その中からカードを(\d+)枚選び、手札に加える$/, m => ({ op: "look_search", look: +m[1], filter: {}, n: +m[2], to: "hand" })],
  [/^残りのカードは(?:すべて)?(ウラにして切り、山札の下にもどす|山札にもどして切る|トラッシュする)$/, m => ({ op: "rest_to", dest: m[1][0] === "ウ" ? "deck_bottom" : m[1][0] === "山" ? "deck_shuffle" : "discard" })],
  [/^自分の山札を上から(\d+)枚見て、もとにもどす$/, m => ({ op: "peek_deck", n: +m[1] })],

// 1文を分析 前置きを順にはがす
function parseSentence(s) {
  const r = { conds: [] };
  let m, go = true;
  s = s.replace(/^(そして|その後、)/, "");
  while (go) {
    go = false;
    const eat = () => { s = s.slice(m[0].length); go = true; };
    if ((m = s.match(/^(?:その場合|入れ替えた場合)、/))) { r.ifPrev = true; eat(); }
    else if ((m = s.match(/^のぞむなら、/))) { r.optional = true; eat(); }

// ワザ
async function dealMain(x) {

  if (!x.ignW && w && N(w.type) === N(a.c.type)) y *= w.value || 2;
  const r = d.c.resistance;
  if (!ignR && r && N(r.type) === N(a.c.type)) y += r.value;
  if (!ignE) {
    if (d.red && d.red.until === P.turns) y -= d.red.n;
    if (passives(O).some(p => p.m === d && p.e.op === "immune_damage_from" && fm(p.e.filter)({ c: a.c }))) y = 0;
  }

  x.ko = d.d >= hpMax(d);

    if (en.c.basic) continue;
    for (const e of cardAna(en.c).tx.effects) if (e.op === "trigger" && e.on === "damaged_in_active") await runEffects({ effects: e.then }, { P: O, O: P, m: d, attacker: a });

async function attack(pi, ai) {

  const x = { P, O, m: a, atk: at, dmg: at.damage && at.damage.mod !== "×" ? at.damage.base : 0, prev: true, opt: true };
  if (a.ov && a.ov.attack === at.name && a.ov.until === P.turns) x.dmg = a.ov.value;
  S.koBy = a;

    const mod = MOD.has(e.op) || (e.op === "discard_energy" && e.optional && E[i + 1] && E[i + 1].ifPrev);

// AI
async function aiTurn() {
  const P = S.p[1], O = S.p[0];

  const best = () => Math.max(0, ...P.act.c.attacks.map(a => a.damage ? a.damage.base : 0));
  for (const h of [...P.hand]) if (isB(h.c) && !full(P)) await bench(P, h);
  if (S.win != null || !P.act) return;
  for (const h of [...P.hand]) if (h.c.kind === "pokemon" && !isB(h.c)) { const m = mons(P).find(y => canEvo(P, y, h)); if (m) { evolve(P, m, h); await onEvolve(P, m); } }
  for (const m of mons(P)) for (const ab of m.c.abilities || []) if (P.act && S.win == null && abOk(P, m, ab) && /引く|手札に加える|つける|ベンチに出す/.test(ab.text)) await useAb(P, m, ab);
  if (S.win != null || !P.act) return;
  for (const h of [...P.hand]) {
    const c = h.c, tx = (c.text || []).join("。");
    if (c.kind !== "trainer" || !P.hand.includes(h) || c.subtype === "スタジアム" || c.subtype === "ポケモンのどうぐ") continue;
    if (!/引く|手札に加える|ベンチに出す|につける|入れ替える|つけ替える|進化させる/.test(tx)) continue;
    if (/手札をすべて山札にもどして切る/.test(tx) && P.hand.length > 4) continue;
    if (/相手のベンチポケモンを1匹選び/.test(tx) && !O.bench.some(m => hpLeft(m) <= best())) continue;
    if (/自分のベンチポケモンを1匹選び、バトルポケモンと入れ替える|自分のバトルポケモンをベンチポケモンと入れ替える/.test(tx)) continue;
    if (/トラッシュしなければ使えない/.test(tx) && P.hand.length < 4) continue;
    if (canPlay(P, h)) await play(h);
    if (S.win != null || !P.act) return;
  }
  for (const h of [...P.hand]) if (h.c.kind === "trainer" && h.c.subtype === "ポケモンのどうぐ" && canPlay(P, h)) await play(h);
  if (S.win != null || !P.act) return;
  for (const h of [...P.hand]) if (isB(h.c) && !full(P)) await bench(P, h);
  const e = P.hand.find(h => h.c.kind === "energy" && !restricted(P, h));
  if (e && !P.en) {
    const ready = P.act.c.attacks.some(at => pay(P.act, effCost(P, P.act, at)));
    const tgt = ready && P.bench.length ? P.bench[0] : P.act;
    attach(P, tgt, e); await onAttach(P, tgt, e);
  }
  const ok = P.act.c.attacks.map((_, i) => i).filter(i => canAtk(P, i));
  if (ok.length) {
    ok.sort((a, b) => (P.act.c.attacks[b].damage?.base || 0) - (P.act.c.attacks[a].damage?.base || 0));
    await attack(1, ok[0]);
  } else await endTurn();
}

// 開始
async function start() {
  const md = DECKS.find(d => d.code === $("myDeck").value), ad = DECKS.find(d => d.code === $("aiDeck").value);
  if (!md || !ad) return msg("デッキがありません");
  const miss = [...new Set([...md.entries, ...ad.entries].filter(e => !CARDS.has(e.id)).map(e => e.id))];
  if (miss.length) return msg("cards.json に無いカード: " + miss.join(", "));
  const build = d => d.entries.flatMap(e => Array.from({ length: e.count }, () => ({ c: CARDS.get(e.id), u: ++uid })));
  S = { p: [mkP(build(md), 0), mkP(build(ad), 1)], t: 0, cur: 0, first: Math.random() < .5 ? 0 : 1, log: [], win: null, stad: null };
  for (const P of S.p) {
    if (!P.deck.some(h => isB(h.c))) return msg("たねポケモンがありません");
    do { P.deck.push(...P.hand.splice(0)); sh(P.deck); draw(P, 7); } while (!P.hand.some(h => isB(h.c)));
    P.prize = P.deck.splice(0, 6);
  }
  S.warned = new Set();
  const un = [];
  for (const c of new Set(S.p.flatMap(P => P.deck.map(h => h.c)))) { const ca = cardAna(c); [...ca.att, ...ca.ab, ca.tx].forEach(a => a.unparsed.forEach(u => un.push(`${c.name}: ${u}`))); }
  if (un.length) { log(`（効果の未対応: ${un.length}文）`); un.slice(0, 6).forEach(u => log(fmt(u).slice(0, 80))); }
  $("setup").hidden = true; $("game").hidden = false;
  for (const P of S.p) {
    const bs = P.hand.filter(h => isB(h.c));
    const a = P.ai ? bs[0] : (await choose("バトルポケモンを選ぶ", bs))[0];
    rm(P, a); P.act = mk(P, a);
    const rest = P.hand.filter(h => isB(h.c));
    const bn = P.ai ? rest.slice(0, 5) : await choose("ベンチに出す（5匹まで）", rest, 5, false);
    bn.forEach(h => benchIt(P, h));
  }
  log(`先攻: ${S.first ? "AI" : "あなた"}`);
  S.cur = S.first; beginTurn();
}
try { $("proxy").value = localStorage.getItem("pkproxy") || ""; } catch {}
$("proxy").oninput = () => { try { localStorage.setItem("pkproxy", $("proxy").value); } catch {} };
$("start").onclick = start;

// 画像
const IMG = new Map(), PEND = new Set();
async function load(u) {
  const p = $("proxy").value.trim();
  try {
    const r = await fetch(p ? p + encodeURIComponent(u) : u);
    if (!r.ok) throw new Error("HTTP " + r.status);
    IMG.set(u, URL.createObjectURL(new Blob([await r.arrayBuffer()], { type: "image/jpeg" })));
  } catch (e) {
    IMG.set(u, "data:,");
    if (S && !S.imgErr) { S.imgErr = 1; log(`画像の取得に失敗: ${e.message}（プロキシURL: ${p || "未設定"}）`); R(); }
  }
  hydrate();
}
function hydrate() {
  document.querySelectorAll("img[data-u]").forEach(im => {
    const u = im.dataset.u, v = IMG.get(u);
    if (v) { if (im.getAttribute("src") !== v) im.src = v; }
    else if (!PEND.has(u)) { PEND.add(u); load(u); }
  });
}
const img = (c, cls) => `<img ${cls ? `class="${cls}" ` : ""}data-u="${c.image}" alt="${c.name}" title="${c.name}">`;

// 拡大表示
function info(c) {
  const wk = c.weakness ? `${TL[N(c.weakness.type)]}×${c.weakness.value}` : "なし", rs = c.resistance ? `${TL[N(c.resistance.type)]}${c.resistance.value}` : "なし";
  return c.kind === "pokemon"
    ? `<p class="sub">HP ${c.hp}　弱点 ${wk}　抵抗力 ${rs}　にげる ${c.retreat}</p>`
      + (c.abilities || []).map(a => `<p><b>特性 ${a.name}</b><br>${fmt(a.text)}</p>`).join("")
      + c.attacks.map(a => `<p><b>${a.cost.map(t => TL[N(t)]).join("")} ${a.name} ${a.damage ? a.damage.base + (a.damage.mod || "") : ""}</b><br>${fmt(a.text)}</p>`).join("")
    : (c.text || []).map(t => `<p>${fmt(t).replace(/\n/g, "<br>")}</p>`).join("");
}
function detail(c, btns, note) {
  const M = $("modal");
  M.hidden = false;
  M.onclick = e => { if (e.target === M) M.hidden = true; };
  M.innerHTML = `<div class="box dt"><div>${img(c, "big")}</div><div class="side"><h3>${c.name}</h3>${note ? `<p class="sub">${note}</p>` : ""}${info(c)}${btns.map((b, i) => `<div class="opt"><button data-b="${i}" ${b.off ? "disabled" : ""}>${b.l}</button><span class="sub">${b.t || ""}</span></div>`).join("")}<p><button id="cl">閉じる</button></p></div></div>`;
  M.querySelectorAll("[data-b]").forEach(b => b.onclick = () => { M.hidden = true; act(btns[b.dataset.b].f); });
  $("cl").onclick = () => { M.hidden = true; };
  hydrate();
}
const myTurn = () => S.cur === 0 && S.win == null;
function showHand(h) {
  const P = S.p[0], c = h.c, mine = myTurn();
  let b;
  if (c.kind === "energy") b = [{ l: "つける", off: !mine || P.en || restricted(P, h), f: async () => { const t = await pickMon(P, mons(P), "エネルギーをつける先", false); if (t) { attach(P, t, h); await onAttach(P, t, h); } } }];
  else if (isB(c)) b = [{ l: "ベンチに出す", off: !mine || full(P), f: () => bench(P, h) }];
  else if (c.kind === "pokemon") b = [{ l: "進化させる", off: !mine || !mons(P).some(m => canEvo(P, m, h)), f: async () => { const t = await pickMon(P, mons(P).filter(m => canEvo(P, m, h)), "進化させるポケモン", false); if (t) { evolve(P, t, h); await onEvolve(P, t); } } }];
  else b = [{ l: "使用", off: !mine || !canPlay(P, h), f: () => play(h) }];
  (c.abilities || []).forEach(ab => { if (c.kind === "pokemon" && ana(ab.text || "").usage === "from_hand") b.push({ l: `特性: ${ab.name}`, off: !mine || !handAbOk(P, ab), f: () => useAb(P, null, ab, h) }); });
  detail(c, b);
}
function showMon(pi, i) {
  const P = S.p[pi], m = i < 0 ? P.act : P.bench[i], b = [];
  if (!m) return;
  if (pi === 0 && myTurn()) {
    if (m === P.act) m.c.attacks.forEach((a, k) => b.push({ l: `ワザ: ${a.name} ${a.damage ? a.damage.base + (a.damage.mod || "") : ""}`, off: !canAtk(P, k), t: a.cost.map(t => TL[N(t)]).join(""), f: () => attack(0, k) }));
    (m.c.abilities || []).forEach(a => b.push({ l: `特性: ${a.name}`, off: !abOk(P, m, a), f: () => useAb(P, m, a) }));
    if (m === P.act) b.push({ l: `にげる（${retCost(P, m)}）`, off: !canRet(P), f: retreat });
  }
  const st = Object.keys(m.sc).map(k => SCL[k]).join("");
  detail(m.c, b, `HP ${hpLeft(m)}/${hpMax(m)}　エネルギー ${m.en.map(e => TL[N(e.c.provides || "colorless")]).join("") || "なし"}${st ? "　状態 " + st : ""}${m.tool ? "　どうぐ " + m.tool.c.name : ""}`);
}

// 描画
const chips = m => m.en.map(e => `<i class="e">${TL[N(e.c.provides || "colorless")] || "?"}</i>`).join("");
const tile = (m, pi, i) => m
  ? `<div class="mon" data-p="${pi}" data-i="${i}">${img(m.c)}<div class="ov"><b>${m.c.name}</b> ${hpLeft(m)}/${hpMax(m)}${Object.keys(m.sc).map(k => `<u>${SCL[k]}</u>`).join("")}${m.tool ? "<u>具</u>" : ""}<br>${chips(m)}</div></div>`
  : `<div class="mon empty">なし</div>`;
function field(P, pi, ctl) {
  const bn = `<div class="bench">${Array.from({ length: 5 }, (_, i) => tile(P.bench[i], pi, i)).join("")}</div>`;
  const act = `<div class="act">${tile(P.act, pi, -1)}<div class="row" style="flex:1">${ctl}</div></div>`;
  return `<div class="field"><div class="pile prize">サイド<br><b>${P.prize.length}</b></div><div class="zone">${pi ? bn + act : act + bn}</div><div><div class="pile deck">山札<br><b>${P.deck.length}</b></div><div class="pile" style="margin-top:6px">トラッシュ<br><b>${P.dis.length}</b><br><button data-a="trash" data-p="${pi}">見る</button></div></div></div>`;
}
function R() {
  const [me, ai] = S.p;
  $("bar").innerHTML = `ターン${S.t} ${S.win != null ? `<b>${S.win ? "AIの勝ち" : "あなたの勝ち"}</b> <button data-a="again">もう一度</button>` : S.cur ? "AIの番" : "あなたの番"}${S.stad ? `　スタジアム: ${S.stad.h.c.name}` : ""}`;
  $("opp").innerHTML = field(ai, 1, `<span class="sub">手札 ${ai.hand.length}枚</span>`);
  $("mine").innerHTML = field(me, 0, `<span class="sub">カードをクリックでワザ・特性・使用</span><button data-a="end" ${myTurn() && !busy ? "" : "disabled"}>ターン終了</button>`);
  $("hand").innerHTML = me.hand.map((h, i) => `<div class="c" data-h="${i}">${img(h.c)}${h.c.name}</div>`).join("");
  $("log").innerHTML = S.log.slice(0, 40).map(x => `<div>${fmt(x)}</div>`).join("");
  hydrate();
}

async function act(f) {
  if (busy) return;
  busy = true;
  try { await f(); } catch (e) { log("エラー: " + e.message); } finally { busy = false; R(); }
}
document.addEventListener("click", e => {
  if (!S || busy) return;
  const t = e.target.closest("[data-a],[data-h],.mon[data-i]");
  if (!t) return;
  const a = t.dataset.a;
  if (a === "again") return location.reload();
  if (a === "trash") {
    const l = S.p[+t.dataset.p].dis, M = $("modal");
    M.hidden = false; M.onclick = null;
    M.innerHTML = `<div class="box"><h3>トラッシュ（${l.length}枚）</h3><div>${l.map(x => x.c.name).join("、") || "なし"}</div><p><button id="cl">閉じる</button></p></div>`;
    $("cl").onclick = () => { M.hidden = true; };
  } else if (a === "end") { if (myTurn()) act(endTurn); }
  else if (t.dataset.h !== undefined) showHand(S.p[0].hand[+t.dataset.h]);
  else if (t.dataset.i !== undefined) showMon(+t.dataset.p, +t.dataset.i);
});
</script>
